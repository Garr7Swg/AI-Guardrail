services:
  - type: web
    name: ai-guardrail-arbitrator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: APP_ALLOWED_HOSTS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GENERATION_MODEL
        sync: false
      - key: REVIEW_MODEL
        sync: false
